# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net
# Based on the official GitHub Actions starter workflow: actions/starter-workflows/ci/dotnet.yml
# See docs/CI.md for details.

name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore PaymentGateway.sln
    - name: Build
      run: dotnet build PaymentGateway.sln --no-restore --configuration Release
    - name: Test
      run: dotnet test PaymentGateway.sln --no-build --configuration Release --verbosity normal
