name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Optional debug: un-redacts the SDK error in logs. Remove once working.
          # show_full_output: true
          prompt: |
            Use the dotnet-reviewer subagent (.claude/agents/dotnet-reviewer.md)
            to review this PR's diff (${{ github.repository }}#${{ github.event.pull_request.number }}).
            It must read docs/CHALLENGE_BRIEF.md first and validate against it
            directly, not from general assumptions. Post the findings as PR
            review comments.
          claude_args: |
            --allowedTools "Read,Glob,Grep,Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
