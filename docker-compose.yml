services:
  bank_simulator:
    container_name: bank_simulator
    image: bbyars/mountebank:2.8.1
    ports:
      - "2525:2525"
      - "8080:8080"
    command: --configfile /imposters/bank_simulator.ejs --allowInjection
    volumes:
      - type: bind
        source: ./imposters
        target: /imposters

  aspire-dashboard:
    container_name: aspire_dashboard
    image: mcr.microsoft.com/dotnet/aspire-dashboard:8.1
    ports:
      - "18888:18888"   # UI
      - "4317:18889"    # OTLP gRPC in - the dashboard listens on 18889 inside
                        # the container, so mapping host 4317 onto it keeps the
                        # app's default OTLP endpoint working unchanged.
    environment:
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
